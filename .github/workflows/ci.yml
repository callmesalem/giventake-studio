name: CI

# Runs on pull requests and on pushes to the Lovable-connected branch.
# AGENTS.md notes that commits pushed to that branch sync back into the Lovable
# editor, so keeping it in a working state matters more than usual — this is the
# gate that catches a broken build before it gets there.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Deliberately not --frozen-lockfile. Tighten this once a run has proved
      # the lockfile resolves cleanly on CI infrastructure.
      - name: Install
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      # The unit suite was never gated. It contains the launch-identity
      # invariants that pin the public contact address and catch an old domain
      # creeping back into the source - checks whose whole value is running
      # without anyone remembering to. The Docker-backed integration test is
      # skipped explicitly rather than silently: an unset variable that happens
      # to skip a suite is indistinguishable from one that passes.
      - name: Test
        run: bun run test
        env:
          ALLOW_DOCKER_INTEGRATION_SKIP: "true"

      # Component tests run on a different runner to the unit suite - node --test
      # strips TypeScript types but does not transform JSX, so anything ending
      # in .tsx needs vitest. Separate step so a rendering failure is
      # distinguishable at a glance from a logic failure.
      - name: Component tests
        run: bun run test:components

      # routeTree.gen.ts is generated by the build AND committed. Typecheck runs
      # before the build and reads the committed copy, so a stale one means CI
      # validates routes that no longer match the files on disk.
      - name: Route tree is current
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            echo "src/routeTree.gen.ts is stale - run the build and commit it."
            git diff --stat -- src/routeTree.gen.ts
            exit 1
          fi

  # The only test that proves migration SQL does what it claims, and until now
  # nothing ever ran it: `verify` skips it through ALLOW_DOCKER_INTEGRATION_SKIP,
  # and the machine these migrations are written on has no Docker either, so the
  # chain shipped desk-checked and a reviewer's reading was the last line of
  # defence. The runners have Docker. This replays every migration on a bare
  # postgres:17 - none of Supabase's default privileges - and asserts the grants
  # and the capability guard. It gates: migrations are applied to production by
  # hand, where a mistake costs a restore rather than a revert.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      # ALLOW_DOCKER_INTEGRATION_SKIP is deliberately unset: if Docker ever
      # leaves the runner this must go red, not quietly pass having tested
      # nothing. That is the failure this job exists to end.
      - name: Migrations against a real Postgres
        run: node tests/crm-grants.integration.test.mjs

  # End-to-end, in a real browser, against the real app. Its own job because it
  # needs a browser download and system libraries, and because a rendering
  # failure here means something different from a unit failure.
  #
  # It gates, unlike a11y. The contact form silently lost every lead for weeks
  # and nothing in the unit suite could have noticed; this is the layer that
  # would have.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Install browser
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The only job that runs the Cloudflare Workers runtime. Everything above
  # runs under Node, and Node allows what Workers forbids: on 2026-09-08 a
  # Response built at module scope passed every job here and took every page
  # on every domain to 500 for a day. This boots the built Worker under a
  # pinned wrangler and puts every expectation in scripts/worker-smoke-checks.mjs
  # to it: the marketing and CRM pages, and the /mcp gateway's own POSTs. It
  # gates, because a green pipeline that production rejects is worse than a
  # red one.
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Build
        run: bun run build

      - name: Smoke the built Worker under the Workers runtime
        run: bun run smoke:worker
  # The consent accessibility suite (20 axe-core + keyboard checks) needs a dev
  # server on :8080 and Playwright. Separate job so a flake here never blocks a
  # copy change, and continue-on-error until it has proved stable on CI.
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: bun install

      - name: Install test dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Start dev server
        run: bun run dev &

      - name: Wait for server
        run: npx --yes wait-on http://localhost:8080 --timeout 120000

      - name: Consent accessibility suite
        run: bun run test:a11y

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-screenshots
          path: tests/a11y/screenshots/
          retention-days: 7
